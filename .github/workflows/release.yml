name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.6.0-wip)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m pytest tests -q
      - run: python3 install.py --package
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --prerelease --target "${{ github.sha }}" \
              --title "Hybrid Supports $TAG (work in progress)" \
              --notes "WORK IN PROGRESS: many features may be broken. Not yet tested inside Cura or on a real print. Install by dragging the .curapackage onto Cura, or unzip the plugin zip into Cura's plugins folder (Help > Show Configuration Folder). See CHANGELOG.md."
          fi
