name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m pytest tests -q
      - name: Install into a scratch Cura folder (checks the one-step installer)
        run: python3 install.py --cli --cura-dir "$RUNNER_TEMP/cura/5.13"
      - run: python3 install.py --package
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-supports-packages
          path: dist/*
